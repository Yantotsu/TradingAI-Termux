name: Deploy Supabase backend

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: supabase-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require passing quality and database isolation checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh run list --workflow quality.yml --commit "$GITHUB_SHA" --limit 20 --json conclusion,status,createdAt --jq 'sort_by(.createdAt) | last | select(.status == "completed") | .conclusion')
          test "$latest" = success || { echo "The latest quality.yml run must succeed for this exact commit"; exit 1; }
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Apply database migration and deploy invite functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF variable"; exit 1; }
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --yes --remote
          supabase functions deploy issue-invite --use-api --yes
          supabase functions deploy redeem-invite --use-api --yes
