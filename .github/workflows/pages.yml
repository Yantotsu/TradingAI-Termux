name: Publish public trading dashboard

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'publish_public.py'
      - 'trained_model.py'
      - 'bot.py'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public snapshot
        run: python publish_public.py
      - name: Prepare static website
        run: |
          mkdir -p site
          cp web/index.html site/index.html
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
